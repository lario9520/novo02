        opcoes: [
            { texto: "Explicar o código, lembrar o que fez e desativar trechos sem apagar", correta: true },
            { texto: "Aumentar o tamanho do arquivo", correta: false },
            { texto: "Deixar o código mais lento", correta: false },
            { texto: "Proteger contra vírus", correta: false }
        ],
        explicacao: "✅ Isso! Os 3 usos principais: 1) Explicar, 2) Lembrar, 3) Testar sem apagar (comenta um pedaço e vê o que acontece).",
        dicaErro: "💡 Dica: É uma ferramenta de ORGANIZAÇÃO. Ajuda você a entender o que fez quando voltar ao código depois.",
        desafio: "Digite o FECHAMENTO de um comentário HTML:",
        respostaDesafio: "-->",
        dicaDesafio: "💡 Dica: Dois traços seguidos e o sinal de maior. Fecha o comentário que você abriu antes."
    }
];

// =====================================================
// LÓGICA DO JOGO + SALVAMENTO + TELA FINAL
// =====================================================
let indiceAtual = 0;
let acertos = 0;
let erros = 0;

const areaQuestoes = document.getElementById('area-questoes');
const barra = document.getElementById('barra');
const contador = document.getElementById('contador');
const spanAcertos = document.getElementById('acertos');
const spanErros = document.getElementById('erros');
const spanPorcentagem = document.getElementById('porcentagem');
const total = questoes.length;

// ========== SALVAR E CARREGAR PROGRESSO ==========
function salvarProgresso() {
    const dados = { indiceAtual, acertos, erros };
    localStorage.setItem('questionario-html-progresso', JSON.stringify(dados));
}

function carregarProgresso() {
    const salvo = localStorage.getItem('questionario-html-progresso');
    if (salvo) {
        const dados = JSON.parse(salvo);
        indiceAtual = dados.indiceAtual || 0;
        acertos = dados.acertos || 0;
        erros = dados.erros || 0;
    }
}

// ========== REINICIAR DO ZERO ==========
function reiniciarTudo() {
    indiceAtual = 0;
    acertos = 0;
    erros = 0;
    localStorage.removeItem('questionario-html-progresso');
    atualizarPainel();
    renderizarQuestao();
}

// ========== BOTÕES DE NAVEGAÇÃO ==========
document.getElementById('btn-voltar').addEventListener('click', function(e) {
    e.preventDefault();
    if (indiceAtual > 0) {
        indiceAtual--;
        salvarProgresso();
        atualizarPainel();
        renderizarQuestao();
    } else {
        alert('⚠️ Você já está na primeira questão!');
    }
});

document.getElementById('btn-inicio').addEventListener('click', function(e) {
    e.preventDefault();
    if (confirm('🏠 Tem certeza que deseja voltar ao início? Todo o progresso será reiniciado!')) {
        reiniciarTudo();
    }
});

function atualizarPainel() {
    contador.textContent = indiceAtual;
    spanAcertos.textContent = acertos;
    spanErros.textContent = erros;
    const porcent = indiceAtual > 0 ? Math.round((acertos / indiceAtual) * 100) : 0;
    spanPorcentagem.textContent = porcent + '%';
    barra.style.width = `${(indiceAtual / total) * 100}%`;
}

// ========== TELA FINAL — PARABÉNS + MOTIVAÇÃO ==========
function mostrarTelaFinal() {
    salvarProgresso();
    const aproveitamento = Math.round((acertos / total) * 100);
    let mensagemMotivacao = '';

    if (aproveitamento >= 90) {
        mensagemMotivacao = `
            🎇 INCRÍVEL! Você é um verdadeiro MESTRE do HTML! 🎇<br><br>
            🌟 Dedicação e esforço trazem resultados extraordinários.<br>
            🌟 Você está mais do que preparado para avançar rumo ao CSS!<br>
            🌟 Continue assim — o sucesso é uma consequência do seu trabalho!
        `;
    } else if (aproveitamento >= 70) {
        mensagemMotivacao = `
            🎉 MUITO BEM! Você dominou o conteúdo com excelência! 🎉<br><br>
            💪 Você está no caminho certo! Cada estudo te aproxima mais do objetivo.<br>
            💪 Com mais um pouco de prática, vai dominar tudo completamente.<br>
            💪 Siga em frente — você é capaz de MUITO mais!
        `;
    } else if (aproveitamento >= 50) {
        mensagemMotivacao = `
            👏 PARABÉNS! Você concluiu o aprendizado! 👏<br><br>
            📚 O progresso vem com a prática. Revise os pontos que errou e vai brilhar!<br>
            📚 Cada tentativa te deixa mais forte. Não desista — persistência é o caminho!<br>
            📚 Você consegue! Revise e tente de novo — vai se surpreender consigo mesmo.
        `;
    } else {
        mensagemMotivacao = `
            🌱 VOCÊ CONCLUIU! Isso já é uma GRANDE conquista! 🌱<br><br>
            💡 O aprendizado é passo a passo. Errar faz PARTE do processo!<br>
            💡 Revise, estude com calma e volte mais forte.<br>
            💡 O único erro de verdade é desistir. Você consegue! Acredite em si mesmo!
        `;
    }

    areaQuestoes.innerHTML = `
        <div class="card tela-final">
            <h2>🎉 PARABÉNS! Você Concluiu! 🎉</h2>
            <div class="resultado">
                <p>✅ Acertos: <strong>${acertos}</strong> de ${total}</p>
                <p>❌ Erros: <strong>${erros}</strong></p>
                <p style="font-size:1.6rem; color:#4caf50; margin-top:10px;">📈 Aproveitamento: <strong>${aproveitamento}%</strong></p>
            </div>
            <div class="motivacao">${mensagemMotivacao}</div>
            <button class="btn btn-reiniciar" onclick="reiniciarTudo()">🔄 REINICIAR</button>
        </div>
    `;
    localStorage.removeItem('questionario-html-progresso');
}

function renderizarQuestao() {
    salvarProgresso();

    // ========== SE CHEGOU AO FIM → MOSTRA TELA FINAL ==========
    if (indiceAtual >= questoes.length) {
        mostrarTelaFinal();
        return;
    }

    const q = questoes[indiceAtual];
    areaQuestoes.innerHTML = `
        <div class="card">
            <span class="tema">${q.tema}</span>
            <p class="pergunta">${indiceAtual+1}. ${q.pergunta}</p>
            <div id="opcoes"></div>
            <div id="feedback" class="feedback"></div>
            <div id="desafio-area" class="desafio oculto">
                <h4>✏️ DESAFIO PRÁTICO — Digite a resposta correta:</h4>
                <p>${q.desafio}</p>
                <input type="text" id="resposta-desafio" placeholder="Digite aqui...">
                <br>
                <button class="btn" onclick="verificarDesafio()">✅ Verificar</button>
                <div id="resultado-desafio" class="resultado-desafio"></div>
                <button class="btn proxima" id="btn-proxima" onclick="proximaQuestao()">➡️ Próxima Questão</button>
            </div>
        </div>
    `;

    const areaOpcoes = document.getElementById('opcoes');
    q.opcoes.forEach((op, i) => {
        const divOpcao = document.createElement('div');
        divOpcao.className = 'opcao';
        divOpcao.textContent = `${String.fromCharCode(65+i)}) ${op.texto}`;
        divOpcao.onclick = () => escolherOpcao(op, divOpcao);
        areaOpcoes.appendChild(divOpcao);
    });
}

function escolherOpcao(opcao, elemento) {
    document.querySelectorAll('.opcao').forEach(o => o.style.pointerEvents = 'none');
    const feedback = document.getElementById('feedback');
    const q = questoes[indiceAtual];

    if (opcao.correta) {
        elemento.classList.add('correta');
        feedback.className = 'feedback certo';
        feedback.innerHTML = `<span class="emoji">✅</span> ${q.explicacao}`;
        acertos++;
    } else {
        elemento.classList.add('errada');
        feedback.className = 'feedback errado';
        feedback.innerHTML = `<span class="emoji">❌</span> ${q.dicaErro}<br><strong>A resposta certa foi destacada em verde.</strong>`;
        erros++;
        document.querySelectorAll('.opcao').forEach((el, i) => {
            if (q.opcoes[i].correta) el.classList.add('correta');
        });
    }

    feedback.style.display = 'block';
    document.getElementById('desafio-area').classList.remove('oculto');
    salvarProgresso();
    atualizarPainel();
}

function verificarDesafio() {
    const respostaUsuario = document.getElementById('resposta-desafio').value.trim();
    const respostaCorreta = questoes[indiceAtual].respostaDesafio;
    const resultado = document.getElementById('resultado-desafio');

    if (respostaUsuario.toLowerCase() === respostaCorreta.toLowerCase()) {
        resultado.innerHTML = '<span style="color:green;">✅ Correto! Você sabe digitar direitinho! 🎉</span>';
        document.getElementById('btn-proxima').style.display = 'inline-block';
    } else {
        resultado.innerHTML = `<span style="color:red;">❌ Quase! A resposta certa é: <strong>${respostaCorreta}</strong></span>`;
        resultado.innerHTML += `<br><span style="color:#ff9800;">💡 ${questoes[indiceAtual].dicaDesafio}</span>`;
        resultado.innerHTML += `<br><span style="color:green;">Tente de novo! 💪</span>`;
    }
}

function proximaQuestao() {
    indiceAtual++;
    salvarProgresso();
    atualizarPainel();
    renderizarQuestao();
}

// ========== INICIA CARREGANDO O PROGRESSO SALVO ==========
carregarProgresso();
atualizarPainel();
renderizarQuestao();
</script>
</body>
</html>
